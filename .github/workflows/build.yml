name: Build IPA

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies & Theos
        run: |
          sudo apt update
          sudo apt install -y git perl build-essential ldid
          git clone https://github.com/theos/theos.git ~/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Build
        run: make package

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: LiveSubtitle.ipa
          path: packages/*.ipa
