name: Build IPA

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Xcode
        run: |
          xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Build & Archive
        run: |
          xcodebuild archive -scheme LiveSubtitle -configuration Release -archivePath LiveSubtitle.xcarchive

      - name: Export IPA
        run: |
          xcodebuild -exportArchive -archivePath LiveSubtitle.xcarchive -exportOptionsPlist exportOptions.plist -exportPath ./output

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: LiveSubtitle-IPA
          path: output/*.ipa
